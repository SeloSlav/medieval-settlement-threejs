<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Field Visual QA</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #a7c4d7; }
      body { position: relative; }
      main { position: absolute; inset: 0; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .caption {
        position: absolute; left: 24px; bottom: 22px; max-width: 390px; padding: 12px 15px;
        border: 1px solid rgba(239,224,181,.34); border-radius: 4px;
        background: rgba(30,30,23,.78); color: #f4ead3;
        box-shadow: 0 5px 20px rgba(0,0,0,.22); backdrop-filter: blur(5px);
        pointer-events: none;
      }
      .caption strong {
        display: block; margin-bottom: 4px; font: 600 18px/1.15 Georgia, serif;
        letter-spacing: .02em;
      }
      .caption span { color: #d1c4a6; font-size: 12px; letter-spacing: .035em; }
      body.clean .caption { display: none; }
    </style>
  </head>
  <body>
    <main id="field-root">
      <div class="caption">
        <strong>September grain harvest</strong>
        <span>Cut stubble · ragged harvest front · standing awned rye · worked soil</span>
      </div>
    </main>
    <script type="module" src="/src/e2e/farmFieldLineup.ts"></script>
  </body>
</html>
