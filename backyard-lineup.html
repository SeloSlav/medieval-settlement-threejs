<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backyard Plant Lineup</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #151912; }
      body { display: grid; grid-template-rows: 70px 1fr; }
      header {
        display: flex; align-items: center; justify-content: space-between; padding: 0 28px;
        border-bottom: 1px solid rgba(224,192,120,.28);
        background: linear-gradient(180deg, #25291f, #1b2018); color: #eee8dc;
      }
      h1 { margin: 0; font-family: Georgia, serif; font-size: 25px; font-weight: 600; }
      header p { margin: 0; color: #beb59f; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      main { position: relative; min-height: 0; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #labels {
        position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
        pointer-events: none;
      }
      .cell { position: relative; border-right: 1px solid rgba(229,214,176,.16); }
      .label {
        position: absolute; left: 20px; right: 20px; bottom: 16px; padding: 7px 10px;
        border: 1px solid rgba(25,24,18,.42); border-radius: 3px;
        background: rgba(28,29,22,.82); color: #f0e7d2; text-align: center;
        font-family: Georgia, serif; font-size: 15px; box-shadow: 0 2px 7px rgba(0,0,0,.18);
      }
      .serve-notice {
        position: absolute; inset: 50% auto auto 50%; z-index: 3; width: min(560px, calc(100% - 40px));
        translate: -50% -50%; padding: 24px 26px; border: 1px solid rgba(224,192,120,.4);
        border-radius: 6px; background: rgba(28,29,22,.96); color: #eee8dc;
        box-shadow: 0 14px 40px rgba(0,0,0,.35); text-align: center;
      }
      .serve-notice p { margin: 0 0 14px; color: #cfc4ad; line-height: 1.5; }
      .serve-notice a { color: #f2ce7c; font-weight: 700; }
    </style>
  </head>
  <body>
    <header>
      <h1>Backyard Plant Lineup</h1>
      <p>Branch, foliage, flower, and fruit attachment check</p>
    </header>
    <main id="lineup-root"><div id="labels" aria-hidden="true"></div></main>
    <script>
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', () => {
          const notice = document.createElement('div');
          notice.className = 'serve-notice';
          notice.innerHTML = `
            <p>This WebGPU lineup uses TypeScript modules and must be opened through the local Vite server.</p>
            <a href="http://127.0.0.1:5173/backyard-lineup.html">Open the working lineup</a>
          `;
          document.querySelector('#lineup-root')?.append(notice);
        });
      }
    </script>
    <script type="module" src="/src/e2e/backyardLineup.ts"></script>
  </body>
</html>
