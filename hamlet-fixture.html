<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AD 1550 Gorski Kotar Hamlet Fixture</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #11150f; }
      body { display: grid; grid-template-rows: 70px 1fr; }
      body.clean { display: block; }
      header {
        display: flex; align-items: center; gap: 24px; padding: 0 22px;
        border-bottom: 1px solid rgba(231, 215, 176, .24);
        background: linear-gradient(180deg, #2b3025, #1c2119); color: #eee7d8;
      }
      .title { min-width: 248px; }
      h1 { margin: 0; font: 600 22px/1.1 Georgia, serif; letter-spacing: .02em; }
      .title p { margin: 5px 0 0; color: #bfb59f; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
      nav { display: flex; flex: 1; flex-wrap: wrap; gap: 6px; }
      nav a {
        padding: 7px 9px; border: 1px solid rgba(231, 215, 176, .2); border-radius: 3px;
        color: #d7d0c0; font: 12px/1 Georgia, serif; text-decoration: none;
        background: rgba(7, 10, 6, .18);
      }
      nav a[aria-current="page"] { border-color: #c5a96c; color: #fff7e3; background: rgba(117, 91, 43, .42); }
      #metrics { margin-left: auto; color: #bfb59f; font: 10px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; text-align: right; white-space: nowrap; }
      main { position: relative; min-height: 0; }
      body.clean main { width: 100%; height: 100%; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #loading {
        position: absolute; inset: 0; z-index: 3; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 42%, #293426, #11150f 68%);
        color: #e8dfca; font: 16px Georgia, serif; letter-spacing: .08em;
      }
      body[data-ready="true"] #loading { display: none; }
      body.clean header { display: none; }
    </style>
  </head>
  <body>
    <header>
      <div class="title">
        <h1>Gorski Kotar parish lane</h1>
        <p>AD 1550 · deterministic fixture</p>
      </div>
      <nav data-view-nav aria-label="Matched review views"></nav>
      <div id="metrics">Building fixture…</div>
    </header>
    <main id="fixture-root">
      <div id="loading">Building the parish lane…</div>
    </main>
    <script type="module" src="/src/e2e/hamletFixture.ts"></script>
  </body>
</html>
