<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Burial-ground placement check</title>
<style>
  body { margin: 0; overflow: hidden; font: 15px system-ui; color: #fff8e9; background: #607152; }
  canvas { display: block; }
  header, footer { position: fixed; left: 20px; padding: 14px 18px; background: #231e18e8; border: 1px solid #c9b17e; border-radius: 8px; }
  header { top: 20px; pointer-events: none; }
  footer { bottom: 20px; max-width: calc(100vw - 80px); }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p { margin: 5px 0; }
  button { margin-top: 10px; padding: 8px 14px; }
</style>
<header><h1>Burial-ground placement check</h1><p>Draw four corners beside the church. Right-click / Backspace undoes; Esc clears.</p></header>
<footer><p id="status"></p><p id="metrics"></p><button id="build" disabled>Place burial ground</button></footer>
<script type="module">
  import * as THREE from 'three';
  import { WebGPURenderer } from 'three/webgpu';
  import { FarmFieldTool } from '/src/farming/FarmFieldTool.ts';
  import { FarmFieldPreview } from '/src/farming/FarmFieldMarkers.ts';
  import { createChapelMesh } from '/src/buildings/meshes/chapelMesh.ts';
  import { fieldArea } from '/src/farming/farmFieldMath.ts';

  const renderer = new WebGPURenderer({ antialias: true });
  await renderer.init();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  document.body.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#607152');
  scene.add(new THREE.HemisphereLight(0xe4efff, 0x61523d, 2));
  const light = new THREE.DirectionalLight(0xffe4c3, 3);
  light.position.set(-15, 30, 20);
  scene.add(light);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(150, 150),
    new THREE.MeshStandardMaterial({ color: '#68764f', roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  const grid = new THREE.GridHelper(100, 50, 0x879574, 0x748562);
  grid.position.y = 0.01;
  scene.add(grid);
  const camera = new THREE.OrthographicCamera(-38, 38, 26, -26, 0.1, 180);
  camera.position.set(16, 55, 38);
  camera.lookAt(2, 0, 0);
  const resize = () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.left = -26 * innerWidth / innerHeight;
    camera.right = 26 * innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  };
  addEventListener('resize', resize);
  resize();
  const chapel = { id: 'fixture-chapel', kind: 'chapel', x: -8, z: 0, yaw: 0.4,
    constructionComplete: true, workRadius: 38 };
  const model = createChapelMesh(1);
  model.position.set(chapel.x, 0, chapel.z);
  model.rotation.y = chapel.yaw;
  scene.add(model);
  const state = { buildings: new Map([[chapel.id, chapel]]), burgageZones: new Map(),
    farmFields: new Map(), pastures: new Map(), graveyards: new Map(), vineyardParcels: new Map() };
  const raycaster = new THREE.Raycaster();
  const previewRoot = new THREE.Group();
  scene.add(previewRoot);
  const status = document.querySelector('#status');
  const metrics = document.querySelector('#metrics');
  const build = document.querySelector('#build');
  const tool = new FarmFieldTool({
    domElement: renderer.domElement, camera,
    terrainProjector: { pick(x, y) {
      raycaster.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, 1 - y / innerHeight * 2), camera);
      return raycaster.intersectObject(ground)[0]?.point ?? null;
    } },
    getState: () => state, getHeightAt: () => 0,
    isWaterAt: () => false, isResourceDepositAt: () => false,
    onCommit() {}, onCommitPasture() {}, onCommitVineyard() {},
    onCommitGraveyard({ corners }) {
      const id = String(state.graveyards.size + 1);
      state.graveyards.set(id, { id, chapelId: chapel.id, corners, area: fieldArea(corners) });
      const placed = new FarmFieldPreview(() => 0);
      placed.show(corners, true, 'fallow', [], 'graveyard');
      scene.add(placed.group);
    },
    onModeChanged() {}, isBlocked: () => false,
  });
  tool.attachTo(previewRoot);
  tool.setMode('graveyard', chapel.id);
  build.addEventListener('click', () => tool.commitDraft());
  const anchors = previewRoot.getObjectByName('Land parcel corner anchors');
  const hover = previewRoot.getObjectByName('Land parcel hover anchor');
  renderer.setAnimationLoop(() => {
    tool.update();
    renderer.domElement.style.cursor = tool.getCursor() ?? 'auto';
    status.textContent = tool.getStatusDetail();
    metrics.textContent = `Fixed corners: ${anchors.count} · Cursor ring: ${hover.visible ? 'visible' : 'hidden'} · Placed parcels: ${state.graveyards.size}`;
    build.disabled = !tool.isDraftBuildable();
    renderer.render(scene, camera);
  });
</script>
</html>
