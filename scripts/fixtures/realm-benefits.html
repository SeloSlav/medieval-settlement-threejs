<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Realm benefits refresh regression</title>
<style>
  body { margin: 24px; background: #24251f; color: #e0d6c2; font: 15px system-ui; }
  button { padding: 10px; margin-bottom: 16px; }
  .resource-inspector-details { width: 420px; }
  [data-inspector-details] { list-style: none; padding: 0; }
  [data-inspector-details] > li { display: flex; align-items: center; gap: 12px; padding: 12px; }
  .inspector-detail-value { margin-left: auto; }
  .ui-tooltip { position: fixed; z-index: 10; pointer-events: none; max-width: 340px; padding: 12px; background: #131810; border: 1px solid #bba156; }
  #results { white-space: pre-wrap; }
</style>
<h1>Realm benefits refresh regression</h1>
<p>Checks that live inspector refreshes preserve unchanged badges, keyboard focus, and tooltips.</p>
<button id="run">Run refresh regression checks</button>
<div id="ui-root" data-inspector-target="building">
  <section class="resource-inspector-details"><ul data-inspector-details></ul></section>
</div>
<pre id="results" role="status">Loading…</pre>
<script type="module">
  import '/src/ui/inspectorSupplemental.css';
  import { ResourceInspector } from '/src/resources/ResourceInspector.ts';
  import { withBuildingLandUseAffinities } from '/src/resources/inspector/buildingLandUseAffinityRenderer.ts';
  import { computeLandUseProfile } from '/src/regions/landUseProfile.ts';
  import { DEFAULT_WORLD_GENERATION_SETTINGS } from '/src/world/worldGenerationSettings.ts';
  import { mountTooltips } from '/src/ui/tooltips.ts';

  const root = document.querySelector('#ui-root');
  const list = root.querySelector('[data-inspector-details]');
  const results = document.querySelector('#results');
  const profile = computeLandUseProfile(DEFAULT_WORLD_GENERATION_SETTINGS, {
    buildings: [], residences: [], farmFields: [], pastures: [], vineyardParcels: [],
  });
  // Exercise the real rendering methods without constructing the 3D selection system.
  const inspector = Object.assign(Object.create(ResourceInspector.prototype), {
    panel: root, detailList: list, renderedDetailsHtml: null,
    renderedDetailsTarget: undefined, renderedDetailRows: [],
  });
  const details = (stock = 10, hiddenValue = 0, landUse = profile, kind = 'pastoral_farmstead') => (
    withBuildingLandUseAffinities({
      detailsHtml: `<li data-local-storage data-inspector-section="Stores"><span>Stored goods</span><span>${stock}</span></li>
        <li><span>Hidden production detail</span><span>${hiddenValue}</span></li>`,
    }, { kind }, landUse).detailsHtml
  );
  const render = (html) => inspector.renderDetails(html);
  const frame = () => new Promise((resolve) => requestAnimationFrame(resolve));
  const unmount = mountTooltips(root);
  window.addEventListener('pagehide', unmount);
  render(details());
  results.textContent = 'Ready';

  document.querySelector('#run').addEventListener('click', async () => {
    const checks = [];
    const check = (condition, label) => {
      if (!condition) throw new Error(label);
      checks.push(`PASS ${label}`);
      results.textContent = checks.join('\n');
    };
    let observer;
    try {
      root.dataset.inspectorTarget = 'building';
      render(details());
      const row = list.querySelector('[data-land-use-affinities]');
      const badge = row.querySelector('.land-use-affinity-badge');
      const icon = badge.querySelector('.land-use-affinity-icon');
      badge.focus();
      await frame();
      const tooltip = document.querySelector('#ui-tooltip');
      check(!tooltip.hidden && tooltip.classList.contains('is-visible'), 'Keyboard focus opens the benefit tooltip');

      const mutations = [];
      observer = new MutationObserver((records) => mutations.push(...records));
      observer.observe(list, { childList: true, attributes: true, characterData: true, subtree: true });
      for (let tick = 0; tick < 20; tick++) render(details());
      await frame();
      check(mutations.length === 0, 'Identical refreshes cause zero detail DOM mutations');

      // These rows are filtered out of building inspectors, but still change the input HTML.
      for (let tick = 1; tick <= 20; tick++) render(details(10, tick));
      await frame();
      check(mutations.length === 0, 'Changes to hidden details cause zero visible DOM mutations');

      for (let tick = 1; tick <= 20; tick++) {
        render(details(10 + tick, tick));
        await frame();
        check(badge.isConnected && document.activeElement === badge && !tooltip.hidden,
          `Refresh ${tick} preserves the focused badge and visible tooltip`);
      }
      check(list.querySelector('[data-land-use-affinities]') === row
        && row.querySelector('.land-use-affinity-icon') === icon,
        'Unchanged realm row and icon retain their original DOM nodes');
      check(!mutations.some((record) => record.target === row || row.contains(record.target)
        || [...record.removedNodes].some((node) => node === row || node.contains(row))),
        'Nearby updates neither mutate nor detach the realm benefits row');
      check(list.querySelector('[data-local-storage]').textContent.includes('30'), 'Changing storage values still update');
      check(list.querySelectorAll('.inspector-detail-section').length === 1, 'Section headings remain unique');
      observer.disconnect();

      const changedProfile = {
        ...profile,
        shares: { ...profile.shares, meadow: 0.25 },
        bonuses: { ...profile.bonuses, meadow: 0.25 },
      };
      render(details(30, 20, changedProfile));
      const changedBadge = list.querySelector('[data-land-use-kind="meadow"]');
      check(changedBadge.textContent.includes('+5%') && changedBadge.dataset.tooltip.includes('25% of the realm'),
        'Real benefit changes refresh both the displayed bonus and tooltip');

      render(details(3, 0, profile, 'fishing_camp'));
      check(!list.querySelector('[data-land-use-affinities]'), 'Selecting a building without benefits removes old badges');
      render('');
      check(list.children.length === 0 && list.parentElement.hidden, 'Empty details clear and hide the section');
      render(details());
      check(!list.parentElement.hidden && list.querySelector('[data-land-use-affinities]'), 'Returning to a building restores its benefits');

      const summary = '<li data-residence-summary data-inspector-section="Household"><span>Residents</span><span>4 / 4</span></li>';
      root.dataset.inspectorTarget = 'residence';
      render(summary);
      const residenceRow = list.querySelector('[data-residence-summary]');
      render(summary);
      check(residenceRow?.isConnected && list.querySelectorAll('.inspector-detail-section').length === 1,
        'Residence summary rows and headings still render correctly');
      root.dataset.inspectorTarget = 'building';
      render(summary);
      check(list.children.length === 0, 'Changing inspector target reruns filtering even with identical input HTML');
      root.dataset.inspectorTarget = 'resource';
      render('<li><span>Available stone</span><span>20 / 40</span></li>');
      check(list.textContent.includes('20 / 40'), 'Other inspector targets retain their ranked details');

      root.dataset.inspectorTarget = 'building';
      render(details());
      results.textContent = `${checks.join('\n')}\n\nAll refresh regression checks passed.`;
    } catch (error) {
      results.textContent = `${checks.join('\n')}\nFAIL ${error.message}`;
      console.error(error);
    } finally {
      observer?.disconnect();
    }
  });
</script>
</html>
