<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runner-Chain Forest-Floor Ivy Lineup</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #12150f; }
      body { display: grid; grid-template-rows: 58px 1fr; }
      body[data-clean="true"] { grid-template-rows: 1fr; }
      header {
        display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 0 24px;
        border-bottom: 1px solid rgba(224, 207, 162, .22); color: #eee9dd;
        background: linear-gradient(180deg, #252b20, #171b14);
      }
      body[data-clean="true"] header { display: none; }
      h1 { margin: 0; font: 600 21px/1 Georgia, serif; }
      header p { margin: 0; color: #bfc6b2; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
      header a { color: #e4c873; text-decoration: none; }
      main { position: relative; min-height: 0; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #contract {
        position: absolute; left: 16px; bottom: 14px; margin: 0; padding: 7px 10px;
        border: 1px solid rgba(225, 211, 172, .18); border-radius: 3px;
        background: rgba(15, 19, 13, .72); color: #ddd9cc; font-size: 11px; letter-spacing: .04em;
        pointer-events: none;
      }
      body[data-clean="true"] #contract { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>Terrain-following forest-floor ivy</h1>
      <p>
        <a href="?view=near">Near</a> ·
        <a href="?view=design">Design</a> ·
        <a href="?view=far">Far</a> ·
        <a href="?view=grazing">Grazing</a>
      </p>
    </header>
    <main id="lineup-root">
      <p id="contract">Tapered runners · alternating lobed leaves · rooted SeedThree wind</p>
    </main>
    <script type="module" src="/src/e2e/forestFloorLineup.ts"></script>
  </body>
</html>
