<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildflower Scale Lineup</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #151912; }
      body { display: grid; grid-template-rows: 70px 1fr; }
      header {
        display: flex; align-items: center; justify-content: space-between; padding: 0 28px;
        border-bottom: 1px solid rgba(224,192,120,.28);
        background: linear-gradient(180deg, #25291f, #1b2018); color: #eee8dc;
      }
      h1 { margin: 0; font-family: Georgia, serif; font-size: 25px; font-weight: 600; }
      header p { margin: 0; color: #beb59f; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      .lineup-link { color: #f2ce7c; text-decoration: none; }
      .lineup-link:hover { text-decoration: underline; }
      main { position: relative; min-height: 0; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #labels {
        position: absolute; left: 10%; right: 6%; bottom: 18px;
        display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); pointer-events: none;
      }
      .label {
        margin: 0 6px; padding: 7px 4px;
        border: 1px solid rgba(25,24,18,.42); border-radius: 3px;
        background: rgba(28,29,22,.82); color: #f0e7d2; text-align: center;
        font-family: Georgia, serif; font-size: 13px; box-shadow: 0 2px 7px rgba(0,0,0,.18);
      }
      .scale {
        position: absolute; left: 22px; bottom: 28px; color: #e8dec7;
        font: 12px/1.3 Inter, sans-serif; letter-spacing: .04em; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Wildflower Scale Lineup</h1>
      <p><a class="lineup-link" href="/backyard-lineup.html">← Backyard plants</a></p>
    </header>
    <main id="lineup-root">
      <div id="labels" aria-hidden="true"></div>
      <div class="scale">1 m reference</div>
    </main>
    <script type="module" src="/src/e2e/wildflowerLineup.ts"></script>
  </body>
</html>
