<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selo Empire Animal Lineup</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        --gold: #d6ad52;
        --paper: #efe7d5;
        --muted: #b8b9a7;
        --line: rgba(226, 194, 119, 0.24);
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #7f8a75; }
      body { display: grid; grid-template-rows: 78px minmax(0, 1fr); }
      header {
        position: relative;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        padding: 0 30px;
        border-bottom: 1px solid var(--line);
        background:
          linear-gradient(90deg, rgba(214, 173, 82, 0.09), transparent 36%),
          linear-gradient(180deg, #252b21, #171c16);
        color: var(--paper);
        box-shadow: 0 8px 26px rgba(20, 24, 18, 0.24);
      }
      .title-block { min-width: 290px; }
      .eyebrow {
        color: var(--gold);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 { margin: 3px 0 0; font: 600 clamp(21px, 2vw, 29px)/1 Georgia, serif; }
      .key {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #c8c8b8;
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .key span::before {
        content: '';
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 7px;
        border-radius: 50%;
        background: var(--key-color);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--key-color) 22%, transparent);
      }
      .key-domestic { --key-color: #d6ad52; }
      .key-wild { --key-color: #82a16c; }
      .key-water { --key-color: #72aabc; }
      #status {
        min-width: 218px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.09em;
        text-align: right;
        text-transform: uppercase;
      }
      body[data-ready="true"] #status { color: #dccb8b; }
      main { position: relative; min-height: 0; isolation: isolate; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(28, 34, 25, 0.08), transparent 36%, rgba(20, 24, 18, 0.18)),
          radial-gradient(ellipse at center 50%, transparent 53%, rgba(24, 27, 21, 0.23) 115%);
      }
      #caption {
        position: absolute;
        z-index: 4;
        left: 50%;
        bottom: 14px;
        translate: -50% 0;
        width: max-content;
        max-width: calc(100% - 32px);
        padding: 7px 12px;
        border: 1px solid rgba(226, 194, 119, 0.24);
        border-radius: 3px;
        background: rgba(22, 26, 19, 0.82);
        color: #c8c4b4;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-align: center;
        text-transform: uppercase;
        pointer-events: none;
      }
      .animal-label {
        min-width: 110px;
        padding: 6px 9px 5px;
        border: 1px solid rgba(231, 211, 159, 0.34);
        border-top: 2px solid var(--animal-accent, #d6ad52);
        border-radius: 3px;
        background: linear-gradient(180deg, rgba(28, 32, 24, 0.95), rgba(17, 20, 15, 0.92));
        color: #f2eadb;
        box-shadow: 0 7px 16px rgba(24, 27, 20, 0.22);
        text-align: center;
        transform: translateY(-2px);
        white-space: nowrap;
      }
      .animal-label strong { display: block; font: 600 13px/1.05 Georgia, serif; }
      .animal-label span {
        display: block;
        margin-top: 3px;
        color: #bdb7a3;
        font-size: 7px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .animal-label[data-category="domestic"] { --animal-accent: #d6ad52; }
      .animal-label[data-category="wild"] { --animal-accent: #82a16c; }
      .animal-label[data-category="water"] { --animal-accent: #72aabc; }
      #error {
        position: absolute;
        z-index: 7;
        inset: 50% auto auto 50%;
        display: none;
        width: min(620px, calc(100% - 40px));
        translate: -50% -50%;
        padding: 22px 24px;
        border: 1px solid #9f563f;
        border-radius: 4px;
        background: rgba(31, 22, 18, 0.97);
        color: #f2dfd5;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.4);
        font-size: 13px;
        line-height: 1.55;
      }
      body[data-error="true"] #error { display: block; }
      @media (max-width: 980px) {
        header { padding-inline: 18px; }
        .key { display: none; }
        #status { min-width: 160px; }
        .animal-label { min-width: 88px; padding-inline: 5px; }
        .animal-label strong { font-size: 11px; }
      }
    </style>
  </head>
  <body data-ready="false">
    <header>
      <div class="title-block">
        <div class="eyebrow">Selo Empire · in-engine asset review</div>
        <h1>Animal Model Lineup</h1>
      </div>
      <div class="key" aria-label="Animal categories">
        <span class="key-domestic">Domestic</span>
        <span class="key-wild">Wild</span>
        <span class="key-water">Water</span>
      </div>
      <div id="status">Loading 13 presentations…</div>
    </header>
    <main id="lineup-root" aria-label="Animated lineup of every animal model used by the game">
      <div id="vignette" aria-hidden="true"></div>
      <div id="caption">13 in-game presentations · 12 distinct source assets · displayed at authored world scale</div>
      <div id="error" role="alert"></div>
    </main>
    <script type="module" src="/src/e2e/animalLineup.ts"></script>
  </body>
</html>
